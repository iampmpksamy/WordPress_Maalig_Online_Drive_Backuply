name: Build & Release WordPress Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Clean dev files
        run: |
          rm -rf .git .github
          rm -f README.md
          rm -f .gitignore
          rm -f LICENSE

      - name: Build clean WordPress ZIP
        run: |
          zip -r maalig-online-drive-backuply.zip . -x "*.git*" "*.github*" "node_modules/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: maalig-online-drive-backuply.zip